<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leave Request Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-surface font-sans">
    <div class="container mx-auto p-6">
        <h1 class="text-2xl font-bold mb-4">Leave Request Form</h1>
        <form class="bg-white p-4 rounded-lg shadow-md">
            <label class="block mb-2" for="start-date">Start Date:</label>
            <input class="border border-gray-300 p-2 mb-4 rounded" type="date" id="start-date" required>
            <label class="block mb-2" for="end-date">End Date:</label>
            <input class="border border-gray-300 p-2 mb-4 rounded" type="date" id="end-date" required>
            <label class="block mb-2" for="leave-type">Leave Type:</label>
            <select class="border border-gray-300 p-2 mb-4 rounded" id="leave-type" required>
                <option value="vacation">Vacation</option>
                <option value="sick">Sick</option>
                <option value="personal">Personal</option>
            </select>
            <label class="block mb-2" for="reason">Reason:</label>
            <textarea class="border border-gray-300 p-2 mb-4 rounded" id="reason" rows="4" required></textarea>
            <button class="bg-primary text-white p-2 rounded" type="submit">Submit Request</button>
        </form>
        <div id="confirmation" class="mt-4 hidden">
            <p class="text-green-600">Your leave request has been submitted successfully!</p>
        </div>
    </div>
    <script>
        document.querySelector('form').addEventListener('submit', async function(event) {
            event.preventDefault();
            const startDate = document.getElementById('start-date').value;
            const endDate = document.getElementById('end-date').value;
            const leaveType = document.getElementById('leave-type').value;
            const reason = document.getElementById('reason').value;
            const response = await fetch('/leave-request', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({start_date: startDate, end_date: endDate, type: leaveType, reason: reason})
            });
            if (response.ok) {
                document.getElementById('confirmation').classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
